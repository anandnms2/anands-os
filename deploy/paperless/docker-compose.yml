# Paperless-ngx for Anands: scan, OCR and tag paper documents, searchable by content.
# Deploy in Coolify as a "Docker Compose" resource from this file, domain paperless.example.com -> service "web" port 8000.
# Fill the variables below in Coolify's environment tab (see README.md).
services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 15s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD:?set a database password}
  web:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      broker: { condition: service_healthy }
    # Coolify shows "healthy" once Paperless answers. The Host header is needed because only the real domain is allowed.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 -H \"Host: $${PAPERLESS_DOMAIN:-paperless.example.com}\" http://localhost:8000/accounts/login/ -o /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - data:/usr/src/paperless/data
      - media:/usr/src/paperless/media
      - export:/usr/src/paperless/export
      - consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set a long random secret}
      PAPERLESS_URL: https://${PAPERLESS_DOMAIN:-paperless.example.com}
      # Behind Coolify's proxy: trust its forwarded host and https headers, or login fails with "CSRF verification failed"
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://${PAPERLESS_DOMAIN:-paperless.example.com}
      PAPERLESS_ALLOWED_HOSTS: ${PAPERLESS_DOMAIN:-paperless.example.com}
      PAPERLESS_CORS_ALLOWED_HOSTS: https://${PAPERLESS_DOMAIN:-paperless.example.com}
      PAPERLESS_USE_X_FORWARD_HOST: "true"
      PAPERLESS_USE_X_FORWARD_PORT: "true"
      PAPERLESS_PROXY_SSL_HEADER: '["HTTP_X_FORWARDED_PROTO", "https"]'
      PAPERLESS_TIME_ZONE: Africa/Dar_es_Salaam
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_OCR_LANGUAGES: ""
      PAPERLESS_APP_TITLE: Anands Documents
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-anand}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?set the first admin password}
      # Sign in with Authentik (same login as the rest of Anands)
      PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
      PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
      PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
      PAPERLESS_SOCIALACCOUNT_PROVIDERS: >-
        {"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Anands SSO","client_id":"${PAPERLESS_OIDC_CLIENT_ID}","secret":"${PAPERLESS_OIDC_CLIENT_SECRET}","settings":{"server_url":"${PAPERLESS_OIDC_ISSUER}/.well-known/openid-configuration"}}]}}
volumes: { redisdata: {}, pgdata: {}, data: {}, media: {}, export: {}, consume: {} }
