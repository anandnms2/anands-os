# Full browser for Anands OS Desktop: Kasm Chrome. Never publish it. Put it on the same Docker network as Anands OS.
services:
  chrome:
    image: kasmweb/chrome:1.17.0
    container_name: anands-chrome
    restart: unless-stopped
    shm_size: "2gb"
    environment:
      VNC_PW: "${CHROME_PW:?set CHROME_PW}"   # the user name is always kasm_user
    volumes:
      - chrome-profile:/home/kasm-user/.config/google-chrome
      - chrome-downloads:/home/kasm-user/Downloads
    expose:
      - "6901"
volumes:
  chrome-profile:
  chrome-downloads:
