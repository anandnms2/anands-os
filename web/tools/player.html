<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Player</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/os.css"><link rel="stylesheet" href="/tools/tool.css"><link rel="stylesheet" href="/tools/player.css"></head>
<body><div class="tl pl" id="pl">
<div class="pmain"><div class="pstage" id="stage"><video id="vid" playsinline></video><div class="part" id="art"><div class="disc"></div><b id="ptitle">Nothing playing</b><span id="psub" class="tmuted">Pick something from your library</span></div></div>
<div class="pctl"><input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek"><div class="ptime"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
<div class="prow"><button class="tb" id="bshuf" aria-label="Shuffle" aria-pressed="false"></button><button class="tb" id="bprev" aria-label="Previous"></button><button class="tb pri big" id="bplay" aria-label="Play"></button><button class="tb" id="bnext" aria-label="Next"></button><button class="tb" id="brep" aria-label="Repeat" aria-pressed="false"></button><span class="sp"></span><select class="tin" id="spd" aria-label="Speed"><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select><span class="pvol">VOL</span><input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume" style="width:90px"><button class="tb" id="bfull">Full</button></div></div></div>
<aside class="pside"><div class="ptabs" role="tablist"><button data-t="lib" class="on">Library</button><button data-t="q">Queue</button><button data-t="pls">Playlists</button></div><div class="pbody" id="pbody"></div></aside></div>
<script src="/tools/tool.js"></script><script src="/tools/player.js"></script></body></html>
