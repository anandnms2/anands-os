<!doctype html>
<html lang="en"><head><link rel="icon" href="/logo-orange.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Video · Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="ed.css">
<script src="/_suite/puter.js"></script>
<style>
body{grid-template-rows:auto minmax(0,1fr)}
#main{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) 250px;min-height:0}
#prev{grid-row:1;grid-column:1;background:var(--work);display:grid;place-items:center;min-height:0;min-width:0;overflow:hidden;padding:10px}
#cv{background:#000;box-shadow:var(--shadow);display:block}
#side{grid-row:1/3;grid-column:2;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1px solid var(--line)}#tabs button{flex:1;border:0;background:none;padding:10px 4px;border-bottom:2px solid transparent;font-weight:600;color:var(--mut)}#tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
#pane{flex:1;overflow:auto;padding:12px;display:grid;gap:10px;align-content:start}
#pane label{display:grid;gap:3px;font-size:12.5px;color:var(--mut)}#pane label input,#pane label select,#pane label textarea{color:var(--fg)}
.media{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--field);border-radius:9px;padding:7px;text-align:left;width:100%}.media:hover{border-color:var(--accent)}.media i{font-style:normal;font-size:20px;width:26px;text-align:center}.media span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media small{color:var(--mut)}
.capr{display:grid;grid-template-columns:62px 62px 1fr 26px;gap:4px;align-items:center}.capr input{padding:4px 5px;font-size:12.5px;border:1px solid var(--line);background:var(--field);border-radius:6px;min-width:0}.capr.on input{border-color:var(--accent)}
#tl{grid-row:2;grid-column:1;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
#tlh{display:flex;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}#tlh .btn{padding:4px 9px}#time{font-variant-numeric:tabular-nums;min-width:112px;text-align:center;font-weight:600}
#scroll{flex:1;overflow:auto;position:relative;min-height:0}
#tin{position:relative;min-height:100%}
#ruler{height:24px;position:sticky;top:0;background:var(--panel2);border-bottom:1px solid var(--line);z-index:4;cursor:pointer}#ruler span{position:absolute;top:4px;font-size:10.5px;color:var(--mut);border-left:1px solid var(--line);padding-left:3px;height:20px}
.trk{position:relative;height:46px;border-bottom:1px solid var(--line);margin:0}.trk .lab{position:sticky;left:4px;font-size:10.5px;color:var(--mut);pointer-events:none;z-index:3;background:var(--panel);padding:0 4px;border-radius:4px;opacity:.85;display:inline-block;margin-top:2px}
.clip{position:absolute;top:5px;height:36px;border-radius:7px;color:#fff;font-size:12px;padding:3px 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;border:2px solid transparent;user-select:none;touch-action:none}
.clip[data-k=video]{background:#2f7bd9}.clip[data-k=image]{background:#2f9e6d}.clip[data-k=audio]{background:#a45bd6}.clip[data-k=text]{background:#d98a2f}.clip[data-k=cap]{background:#555}
.clip.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}.clip.miss{background:repeating-linear-gradient(45deg,#a33,#a33 6px,#722 6px,#722 12px)}
.clip .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}.clip .h.l{left:0}.clip .h.r{right:0}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:5;pointer-events:none}#ph:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--accent)}
.empty{padding:30px;text-align:center;color:var(--mut)}
@media(max-width:860px){#main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 220px 260px}#side{grid-row:3;grid-column:1;border-left:0;border-top:1px solid var(--line)}#tl{grid-row:2}}
</style></head><body>
<header class="bar"><a class="logo" href="./#videos" title="Back to Design Studio"><b><img src="/logo-orange.png" alt="" width="26" height="26"></b><span>Video</span></a><input id="title" class="ttl" aria-label="Video title" placeholder="Untitled video"><span id="st" class="st" role="status"></span><span class="grow"></span>
<button class="btn" id="bUndo" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button><button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button><select class="btn" id="ratio" aria-label="Shape"><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option></select><button class="btn pri" id="bEx">Export ▾</button><button class="btn" id="btnTheme" aria-label="Switch theme">◐</button></header>
<div id="main"><div id="prev"><canvas id="cv" aria-label="Video preview"></canvas></div>
<div id="tl"><div id="tlh"><button class="btn" id="bBeg" aria-label="Go to start">⏮</button><button class="btn pri" id="bPlay" aria-label="Play">▶</button><span id="time">0:00.0 / 0:00.0</span><button class="btn" id="bSplit" title="Split at the playhead (S)">✂ Split</button><button class="btn danger" id="bDel" title="Delete (Del)">Delete</button><button class="btn" id="bTitle">+ Title</button><span class="grow"></span><label class="note" style="display:flex;gap:6px;align-items:center">Zoom <input type="range" id="zoom" min="10" max="240" value="60" aria-label="Timeline zoom"></label></div>
<div id="scroll"><div id="tin"></div></div></div>
<aside id="side"><div id="tabs" role="tablist"><button role="tab" data-tab="media">Media</button><button role="tab" data-tab="clip">Clip</button><button role="tab" data-tab="caps">Captions</button></div><div id="pane"></div></aside></div>
<input type="file" id="fMedia" accept="video/*,audio/*,image/*" multiple hidden><input type="file" id="fSrt" accept=".srt,.vtt,text/plain" hidden>
<script src="ed.js"></script><script src="video.js"></script>
</body></html>
