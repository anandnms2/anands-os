<!doctype html>
<html lang="en"><head><link rel="icon" href="/logo-orange.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Websites · Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="ed.css">
<script src="/_suite/puter.js"></script><script src="vendor/jszip.min.js"></script>
<style>
body{grid-template-rows:auto minmax(0,1fr)}.bar{overflow-x:auto}
#main{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;min-height:0}
.side{background:var(--panel);overflow:auto;min-height:0}#lp{border-right:1px solid var(--line)}#rp{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}.tabs button{flex:1;border:0;background:none;padding:10px 4px;border-bottom:2px solid transparent;font-weight:600;color:var(--mut)}.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.pad{padding:12px;display:grid;gap:10px;align-content:start}.pad h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.blocks button{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:9px 6px;display:grid;gap:3px;justify-items:center;font-size:12.5px}.blocks button:hover{border-color:var(--accent)}.blocks button span{font-size:20px}
#viewwrap{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;background:var(--work)}
#vbar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#vscroll{overflow:auto;display:grid;justify-items:center;padding:14px}#frame{border:0;background:#fff;box-shadow:var(--shadow);border-radius:8px;width:100%;height:100%;min-height:600px}#frame.mobile{width:390px}#frame.tablet{width:820px;max-width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lab{display:grid;gap:3px;font-size:12.5px;color:var(--mut)}.lab input[type=color]{width:100%;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.item{border:1px solid var(--line);border-radius:9px;padding:6px 8px;display:flex;gap:6px;align-items:center;background:var(--field)}.item .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}.item.on{border-color:var(--accent);background:var(--accent-soft)}.item button{border:0;background:none;padding:2px 5px;border-radius:5px}.item button:hover{background:var(--panel2)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,200px);justify-content:center;gap:14px;max-height:62vh;overflow:auto;padding:2px}.tgrid.small{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));max-height:30vh}.tcard{display:grid;gap:3px;text-align:left;border:1px solid var(--line);background:var(--field);border-radius:12px;padding:8px;cursor:pointer;color:var(--fg);min-width:0}.tcard:hover{border-color:var(--accent)}.tcard small{color:var(--mut)}.tthumb{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:8px;background:var(--panel2)}.tthumb.blank{display:grid;place-items:center;font-size:34px;color:var(--mut)}.tframe{position:absolute;left:0;top:0;width:1200px;height:900px;border:0;transform-origin:0 0;transform:scale(.1533);pointer-events:none;background:#fff}.modal .dlg.wide,.modal.wide .dlg{width:min(1040px,95vw);max-width:95vw}@media(max-width:1000px){#main{grid-template-columns:minmax(0,1fr)}#lp,#rp{position:fixed;top:56px;bottom:0;width:min(300px,86vw);z-index:40;box-shadow:var(--shadow);transform:translateX(-110%);transition:.2s}#rp{right:0;left:auto;transform:translateX(110%)}#lp.open{transform:none}#rp.open{transform:none}}
@media(min-width:1001px){.only-sm{display:none!important}}
</style></head><body>
<header class="bar"><a class="logo" href="./#sites" title="Back to Design Studio"><b><img src="/logo-orange.png" alt="" width="26" height="26"></b><span class="hide-sm">Websites</span></a><input id="title" class="ttl" aria-label="Website name" placeholder="Untitled website"><span id="st" class="st" role="status"></span><span class="grow"></span>
<button class="btn only-sm" id="bL">Add</button><button class="btn only-sm" id="bR">Edit</button><button class="btn" id="bTpl">Templates</button><button class="btn" id="bDl">Export ▾</button><button class="btn pri" id="bPub">Publish</button><button class="btn" id="btnTheme" aria-label="Light or dark">◐</button></header>
<div id="main"><aside id="lp" class="side"><div class="tabs" role="tablist"><button role="tab" data-t="add" aria-selected="true">Add</button><button role="tab" data-t="pages" aria-selected="false">Pages</button><button role="tab" data-t="theme" aria-selected="false">Theme</button></div><div id="lbody" class="pad"></div></aside>
<section id="viewwrap"><div id="vbar"><button class="btn sm" data-w="">Desktop</button><button class="btn sm" data-w="tablet">Tablet</button><button class="btn sm" data-w="mobile">Phone</button><span class="grow"></span><select id="pagesel" class="f" style="width:auto" aria-label="Page"></select></div><div id="vscroll"><iframe id="frame" title="Website preview"></iframe></div></section>
<aside id="rp" class="side"><div class="tabs"><button style="cursor:default">Selected section</button></div><div id="rbody" class="pad"></div></aside></div>
<script src="vendor/qrcode.js"></script><script src="ed.js"></script><script src="site-art.js"></script><script src="site-tpl-data.js"></script><script src="site-tpl-more.js"></script><script src="site-tpl.js"></script><script src="site-tpl-b01.js"></script><script src="site.js"></script>
</body></html>
