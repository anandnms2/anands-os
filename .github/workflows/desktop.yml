name: desktop
# Builds the Anands OS desktop app (Windows installer, Mac disk image). Run it from the Actions tab ("Run workflow"), or push a tag like desktop-v1.0.0 to also publish a release.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash suite/build.sh "$RUNNER_TEMP/upstream" "$GITHUB_WORKSPACE/suite-dist"
      - uses: actions/upload-artifact@v4
        with: { name: suite-dist, path: suite-dist, retention-days: 2 }
  app:
    needs: suite
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, args: --win, name: windows }
          - { os: macos-latest, args: --mac, name: mac }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: suite-dist, path: suite-dist }
      - run: npm ci --prefix desktop
      - run: node desktop/stage.mjs
        env: { SUITE_DIST: '${{ github.workspace }}/suite-dist' }
      - run: npx electron-builder ${{ matrix.args }} --publish never
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: anands-os-${{ matrix.name }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
          retention-days: 2
      - if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
