services:
  anands-os:
    image: ${IMAGE:-ghcr.io/anandnms2/anands-os:latest}
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: ${PUBLIC_URL}
      APP_PASSWORD: ${APP_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED: ${OIDC_ALLOWED:-}
      OWNER_NAME: ${OWNER_NAME:-Anand}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN:-}
      DAV_URL: ${DAV_URL:-}
      DAV_USER: ${DAV_USER:-}
      DAV_PASSWORD: ${DAV_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}
      SMTP_DAILY_CAP: ${SMTP_DAILY_CAP:-}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET: ${TURN_SECRET:-}
      STUN_URLS: ${STUN_URLS:-}
      PAPERLESS_TOKEN: ${PAPERLESS_TOKEN:-}
      VAULT_URL: ${VAULT_URL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      CONNECT_SRC_EXTRA: ${CONNECT_SRC_EXTRA:-}
    volumes:
      - anands-os-data:/data
    expose:
      - "8080"
  # Built-in meeting relay (TURN). Set TURN_SECRET and open UDP/TCP 3478 and UDP 49160-49200 on the server firewall.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    profiles: ["relay"]
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - "-n"
      - "--lt-cred-mech"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET}"
      - "--realm=${TURN_REALM:-example.com}"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--fingerprint"
      - "--no-multicast-peers"
volumes:
  anands-os-data:
